<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Deals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .updated {
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 15px;
    }

    .title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .price {
      font-size: 18px;
      color: #22c55e;
      margin-bottom: 10px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .affiliate {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <h1>🔥 Card Deals</h1>
  <div class="updated" id="updated"></div>

  <div class="grid" id="grid"></div>

  <!-- ✅ THIS IS THE IMPORTANT PART -->
  <script src="data.js"></script>

  <!-- ✅ YOUR MAIN SCRIPT -->
  <script>
    function renderCards() {
      const grid = document.getElementById("grid");
      const updated = document.getElementById("updated");

      // show last updated
      updated.innerText = "Last Updated: " + APP_DATA.updated_at;

      grid.innerHTML = "";

      APP_DATA.cards.forEach(card => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <div class="title">${card.title}</div>
          <div class="price">$${card.ebay_price}</div>
          <a href="${card.ebay_url || '#'}" target="_blank">
            <button>View on eBay</button>
          </a>
          <div class="affiliate">
            I am an Ebay affiliate, I make commissions on Sales
          </div>
        `;

        grid.appendChild(div);
      });
    }

    // run after page loads
    renderCards();
  </script>

</body>
</html>
